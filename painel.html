<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fábrica de Carrosséis</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161a21; --panel2:#1d222b; --line:#2a303b;
    --txt:#e9ecf1; --mut:#8b94a5; --accent:#FFF8BB; --accent-ink:#2a2400;
    --blue:#7DB8FF; --ok:#5fd08a; --err:#ff7a7a; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  h1,h2,h3{margin:0;font-weight:700}
  .serif{font-family:Georgia,'Times New Roman',serif}
  button{font:inherit;color:inherit;cursor:pointer}
  header{display:flex;align-items:center;gap:20px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{font-family:Georgia,serif;font-size:20px;color:var(--accent);font-weight:700;letter-spacing:.2px}
  nav{display:flex;gap:4px;margin-left:12px}
  nav button{background:none;border:0;padding:8px 14px;border-radius:9px;color:var(--mut);font-weight:600}
  nav button:hover{color:var(--txt)}
  nav button.on{background:var(--panel2);color:var(--txt)}
  main{flex:1;display:flex;min-height:0}
  aside{width:270px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .novo{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:8px}
  .novo input{flex:1;min-width:0}
  #lista{overflow:auto;padding:8px;flex:1}
  .item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:11px;padding:10px 12px;margin-bottom:4px}
  .item:hover{background:var(--panel2)}
  .item.on{background:var(--panel2);border-color:var(--line)}
  .item b{display:block;font-weight:600;word-break:break-word}
  .item small{color:var(--mut)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#243a2e;color:var(--ok);margin-left:6px;vertical-align:1px}
  section.view{flex:1;overflow:auto;padding:28px;display:none}
  section.view.on{display:block}
  .wrap{max-width:980px;margin:0 auto}
  input[type=text],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:inherit}
  input:focus,textarea:focus{outline:2px solid #3b4a6b;border-color:#3b4a6b}
  textarea{resize:vertical;min-height:120px}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
  a.btn{color:var(--txt);text-decoration:none;display:inline-block}
  .btn:hover{border-color:#47506a}
  .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.pri:hover{filter:brightness(1.05)}
  .btn:disabled{opacity:.5;cursor:default}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
  .step{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .step i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
  .step h3{font-size:17px}
  .step span{color:var(--mut);font-size:13px;margin-left:auto}
  .hint{color:var(--mut);font-size:13px;margin:8px 0 0}
  .drop{border:2px dashed #3a4256;border-radius:var(--r);padding:26px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--accent);color:var(--txt);background:#1c1f18}
  .drop b{color:var(--txt)}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:14px}
  .foto{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--line)}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto .n{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:12px;border-radius:7px;padding:1px 8px}
  .foto .x{position:absolute;right:5px;top:5px;background:#000a;border:0;border-radius:50%;width:24px;height:24px;line-height:22px;font-size:15px;opacity:0;transition:.15s}
  .foto:hover .x{opacity:1}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .status{font-size:13px;color:var(--mut)}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .gerar{display:flex;gap:14px;align-items:center;margin:6px 0 22px;flex-wrap:wrap}
  .gerar .btn.pri{font-size:17px;padding:14px 28px;border-radius:12px}
  .slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:14px}
  .slide{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;aspect-ratio:4/5;background:#000}
  .slide img{width:100%;height:100%;object-fit:cover;display:block}
  .slide span{position:absolute;right:6px;bottom:6px;background:#000b;font-size:11px;border-radius:6px;padding:1px 7px}
  .avisos{background:#3a2a14;border:1px solid #6b4a1f;border-radius:10px;padding:10px 14px;color:#ffcf8a;margin-bottom:12px;font-size:14px}
  .empty{text-align:center;color:var(--mut);padding:80px 20px}
  .empty h2{font-family:Georgia,serif;color:var(--txt);font-size:26px;margin-bottom:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  label{display:block;font-size:13px;color:var(--mut);margin:0 0 5px;font-weight:600}
  .colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .colors .c{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .colors input[type=color]{width:38px;height:38px;border:0;background:none;padding:0;cursor:pointer}
  .colors span{font-size:13px}
  .colors code{color:var(--mut);font-size:12px;display:block}
  #lightbox{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:9;cursor:zoom-out}
  #lightbox.on{display:grid}
  #lightbox img{max-height:94vh;max-width:94vw;border-radius:8px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:10px;display:none;z-index:10}
  details summary{cursor:pointer;color:var(--mut);font-size:13px}
  pre.fmt{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12.5px;color:#c8cfdb;margin:8px 0 0}
  @media (max-width:820px){aside{display:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div class="logo">Fábrica de Carrosséis</div>
  <nav>
    <button data-tab="carrosseis" class="on">Carrosséis</button>
    <button data-tab="prompt">Prompt da IA</button>
    <button data-tab="estilo">Estilo</button>
  </nav>
</header>

<main>
  <aside id="lateral">
    <div class="novo">
      <input type="text" id="novoNome" placeholder="nome do novo carrossel" maxlength="60">
      <button class="btn pri" id="btnNovo" title="Criar">+</button>
    </div>
    <div id="lista"></div>
  </aside>

  <!-- ===== CARROSSÉIS ===== -->
  <section class="view on" id="v-carrosseis">
    <div class="wrap" id="editor"></div>
  </section>

  <!-- ===== PROMPT ===== -->
  <section class="view" id="v-prompt">
    <div class="wrap">
      <div class="card">
        <div class="step"><i>1</i><h3>Conte sobre o seu perfil e o tema</h3></div>
        <div class="grid2">
          <div><label>Seu nicho</label><input type="text" id="pNicho" placeholder="ex: hospedagem e turismo rural"></div>
          <div><label>Seu público</label><input type="text" id="pPublico" placeholder="ex: famílias que querem fugir da correria"></div>
          <div><label>Tom de voz</label><input type="text" id="pTom" placeholder="ex: acolhedor, direto, sem enrolação"></div>
          <div><label>Número de slides</label><input type="number" id="pSlides" value="8" min="4" max="12"></div>
        </div>
        <div style="margin-top:14px"><label>Tema deste carrossel</label><input type="text" id="pTema" placeholder="ex: por que você precisa de um dia sem pressa com a família"></div>
      </div>
      <div class="card">
        <div class="step"><i>2</i><h3>Copie e cole na IA</h3><span id="pAviso"></span></div>
        <textarea id="pSaida" readonly style="min-height:320px;font-size:13px"></textarea>
        <div class="row" style="margin-top:12px">
          <button class="btn pri" id="pCopiar">Copiar prompt</button>
          <span class="status">Depois traga a resposta da IA para a aba Carrosséis.</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== ESTILO ===== -->
  <section class="view" id="v-estilo">
    <div class="wrap">
      <div class="card">
        <div class="step"><h3>Estilo dos slides</h3></div>
        <div class="grid2">
          <div><label>Assinatura (rodapé dos slides lisos)</label><input type="text" id="cAssinatura" placeholder="@seuperfil"></div>
          <div><label>Escurecer a foto: <b id="cEscVal"></b></label><input type="range" id="cEscurecer" min="0" max="0.8" step="0.02" style="width:100%"></div>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin:14px 0;color:var(--txt);font-weight:500"><input type="checkbox" id="cAssFoto"> Mostrar assinatura também nos slides com foto</label>
        <div class="colors" id="cores"></div>
        <div class="row" style="margin-top:18px">
          <button class="btn pri" id="cSalvar">Salvar estilo</button>
          <span class="status" id="cStatus">Vale para os próximos slides que você gerar.</span>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="lightbox"><img alt=""></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qs = o => new URLSearchParams(o).toString();
let atual = null;       // nome do carrossel aberto
let saveTimer = null;

function toast(msg, ms = 2400){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms);
}
async function api(url, opts = {}){
  const r = await fetch(url, opts);
  const ct = r.headers.get('content-type') || '';
  const d = ct.includes('json') ? await r.json() : await r.text();
  if(!r.ok) throw new Error(d.erro || 'Erro');
  return d;
}

/* ---------- abas ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.tab));
  $('#lateral').style.display = b.dataset.tab === 'carrosseis' ? '' : 'none';
});

/* ---------- lista lateral ---------- */
async function carregarLista(){
  const lista = await api('/api/carrosseis');
  $('#lista').innerHTML = lista.length ? lista.map(c => `
    <button class="item ${c.nome === atual ? 'on' : ''}" data-n="${esc(c.nome)}">
      <b>${esc(c.nome)}${c.slides_gerados ? '<span class="tag">pronto</span>' : ''}</b>
      <small>${c.fotos} foto${c.fotos === 1 ? '' : 's'} · ${c.slides_texto} slide${c.slides_texto === 1 ? '' : 's'} no texto</small>
    </button>`).join('') : '<p class="hint" style="padding:10px">Nenhum carrossel ainda.</p>';
  document.querySelectorAll('.item').forEach(b => b.onclick = () => abrir(b.dataset.n));
}

async function criar(){
  const nome = $('#novoNome').value;
  if(!nome.trim()) return toast('Digite um nome para o carrossel');
  try{
    const r = await api('/api/carrossel', {method:'POST', body: JSON.stringify({nome})});
    $('#novoNome').value = '';
    await abrir(r.nome);
  }catch(e){ toast(e.message) }
}
$('#btnNovo').onclick = criar;
$('#novoNome').onkeydown = e => { if(e.key === 'Enter') criar() };

/* ---------- editor ---------- */
async function abrir(nome){
  atual = nome;
  const d = await api('/api/carrossel?' + qs({c: nome}));
  desenhar(d);
  carregarLista();
}

function desenhar(d){
  $('#editor').innerHTML = `
    <div class="row" style="margin-bottom:18px">
      <h2 class="serif" style="font-size:28px">${esc(d.nome)}</h2>
    </div>

    <div class="card">
      <div class="step"><i>1</i><h3>Fotos</h3><span>${d.lista_fotos.length} na pasta</span></div>
      <div class="drop" id="drop"><b>Arraste as fotos aqui</b> ou clique para escolher<br>
        <small>Pode ser qualquer nome de arquivo. A <b>ordem</b> (número no canto) é a ordem do nome.</small>
        <input type="file" id="arq" multiple accept="image/jpeg,image/png,image/webp" hidden></div>
      <div class="fotos" id="fotos">${d.lista_fotos.map((f, i) => `
        <div class="foto" title="${esc(f)}">
          <img loading="lazy" src="/files/fotos/${encodeURIComponent(d.nome)}/${encodeURIComponent(f)}?t=1">
          <span class="n">${i + 1}</span>
          <button class="x" data-f="${esc(f)}" title="Remover foto">×</button>
        </div>`).join('')}</div>
      <p class="hint">"Foto 1" no texto = a primeira da lista acima, "foto 2" = a segunda, e assim por diante.</p>
    </div>

    <div class="card">
      <div class="step"><i>2</i><h3>Texto</h3><span id="contaSlides">${d.slides_texto} slides detectados</span></div>
      <textarea id="texto" style="min-height:230px" placeholder="Cole aqui a resposta da IA. Pode colar a resposta inteira: eu pego só o bloco dos slides.">${esc(d.texto)}</textarea>
      <div class="row" style="margin-top:8px">
        <span class="status" id="salvoStatus"></span>
        <details class="grow"><summary>Ver o formato esperado</summary>
<pre class="fmt">---
FOTO: 1
POSICAO: base
TEXTO: Frase com *destaque* em cor
---
FUNDO: escuro
POSICAO: centro
TEXTO: Slide liso com explicação
=== LEGENDA ===
Legenda do post + #hashtags</pre></details>
      </div>
    </div>

    <div class="gerar">
      <button class="btn pri" id="btnGerar">✨ Gerar carrossel</button>
      <span class="status" id="genStatus"></span>
    </div>

    <div id="resultado"></div>`;

  const nome = d.nome;
  const drop = $('#drop'), arq = $('#arq');
  drop.onclick = () => arq.click();
  arq.onchange = () => enviar(nome, arq.files);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over') };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); enviar(nome, e.dataTransfer.files) };
  document.querySelectorAll('.foto .x').forEach(b => b.onclick = async () => {
    if(!confirm('Remover esta foto da pasta do carrossel?')) return;
    await api('/api/foto?' + qs({c: nome, f: b.dataset.f}), {method:'DELETE'});
    abrir(nome);
  });
  $('#texto').oninput = () => {
    $('#salvoStatus').textContent = 'salvando…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => salvarTexto(nome), 500);
  };
  $('#texto').onpaste = () => setTimeout(() => salvarTexto(nome, true), 50);
  $('#btnGerar').onclick = () => gerarAgora(nome);
  if(d.lista_slides.length) mostrarResultado(d);
}

async function enviar(nome, files){
  const imgs = [...files].filter(f => /\.(jpe?g|png|webp)$/i.test(f.name));
  if(!imgs.length) return toast('Escolha arquivos jpg, png ou webp');
  let i = 0;
  for(const f of imgs){
    i++; toast(`Enviando ${i}/${imgs.length}…`, 8000);
    await api('/api/foto?' + qs({c: nome, f: f.name}), {method:'PUT', body: f});
  }
  toast('Fotos adicionadas ✓');
  abrir(nome);
}

async function salvarTexto(nome, limpar = false){
  const ta = $('#texto'); if(!ta) return;
  const h = limpar ? {'X-Limpar': '1'} : {};
  const r = await api('/api/texto?' + qs({c: nome}), {method:'PUT', body: ta.value, headers: h});
  if(limpar && r.texto && r.texto.trim() !== ta.value.trim()) ta.value = r.texto;
  $('#contaSlides').textContent = `${r.slides} slides detectados`;
  $('#salvoStatus').textContent = 'salvo ✓'; $('#salvoStatus').className = 'status ok';
  carregarLista();
}

async function gerarAgora(nome){
  const btn = $('#btnGerar'), st = $('#genStatus');
  btn.disabled = true; st.className = 'status'; st.textContent = 'Gerando…';
  try{
    await salvarTexto(nome, true);
    const d = await api('/api/gerar?' + qs({c: nome}), {method:'POST'});
    st.className = 'status ok'; st.textContent = `Pronto! ${d.lista_slides.length} slides gerados.`;
    mostrarResultado(d);
    carregarLista();
    $('#resultado').scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){
    st.className = 'status err'; st.textContent = e.message;
  }finally{ btn.disabled = false }
}

function mostrarResultado(d){
  const v = Date.now(), base = `/files/saida/${encodeURIComponent(d.nome)}/`;
  $('#resultado').innerHTML = `
    <div class="card">
      <div class="step"><i>3</i><h3>Resultado</h3>
        <span><a class="btn" style="text-decoration:none;display:inline-block" href="/api/zip?${qs({c: d.nome})}">⬇ Baixar tudo (.zip)</a></span></div>
      ${(d.avisos || []).length ? `<div class="avisos">${d.avisos.map(esc).join('<br>')}</div>` : ''}
      <div class="slides">${d.lista_slides.map((s, i) => `
        <div class="slide" data-src="${base}${s}?v=${v}"><img loading="lazy" src="${base}${s}?v=${v}"><span>${i + 1}/${d.lista_slides.length}</span></div>`).join('')}</div>
      ${d.legenda ? `<div style="margin-top:18px"><label>Legenda</label><textarea id="legenda" style="min-height:130px">${esc(d.legenda)}</textarea>
        <button class="btn" id="copLeg" style="margin-top:8px">Copiar legenda</button></div>` : ''}
    </div>`;
  document.querySelectorAll('.slide').forEach(s => s.onclick = () => {
    $('#lightbox img').src = s.dataset.src; $('#lightbox').classList.add('on');
  });
  const cl = $('#copLeg'); if(cl) cl.onclick = () => { navigator.clipboard.writeText($('#legenda').value); toast('Legenda copiada ✓') };
}
$('#lightbox').onclick = () => $('#lightbox').classList.remove('on');
document.onkeydown = e => { if(e.key === 'Escape') $('#lightbox').classList.remove('on') };

/* ---------- prompt da IA ---------- */
let template = '';
function montarPrompt(){
  let t = template;
  const set = (rot, val, ph) => {
    t = t.replace(new RegExp('(- ' + rot + ':\\s*)\\[\\[.*?\\]\\]'), (m, a) => a + (val.trim() || ph));
  };
  set('Meu perfil/nicho', $('#pNicho').value, '[[preencha seu nicho]]');
  set('Público', $('#pPublico').value, '[[preencha seu público]]');
  set('Tom de voz', $('#pTom').value, '[[preencha o tom de voz]]');
  set('Número de slides', $('#pSlides').value, '8');
  set('TEMA DESTE CARROSSEL', $('#pTema').value, '[[preencha o tema]]');
  $('#pSaida').value = t;
  const faltam = (t.match(/\[\[preencha/g) || []).length;
  $('#pAviso').textContent = faltam ? `faltam ${faltam} campo(s)` : 'tudo preenchido ✓';
}
['pNicho','pPublico','pTom','pSlides','pTema'].forEach(id => $('#' + id).oninput = () => { montarPrompt(); salvarPerfil() });
$('#pCopiar').onclick = () => { navigator.clipboard.writeText($('#pSaida').value); toast('Prompt copiado ✓') };
function salvarPerfil(){ try{ localStorage.setItem('perfil', JSON.stringify({n:$('#pNicho').value,p:$('#pPublico').value,t:$('#pTom').value,s:$('#pSlides').value})) }catch(e){} }
(async () => {
  template = (await api('/api/prompt')).template;
  try{ const p = JSON.parse(localStorage.getItem('perfil') || '{}');
    $('#pNicho').value = p.n || ''; $('#pPublico').value = p.p || ''; $('#pTom').value = p.t || ''; if(p.s) $('#pSlides').value = p.s }catch(e){}
  montarPrompt();
})();

/* ---------- estilo ---------- */
const CORES = [
  ['cor_texto','Texto sobre foto'], ['cor_destaque','Destaque sobre foto'],
  ['cor_fundo_escuro','Fundo escuro'], ['cor_fundo_claro','Fundo claro'],
  ['cor_texto_sobre_claro','Texto no fundo claro'], ['cor_destaque_sobre_claro','Destaque no fundo claro'],
];
async function carregarConfig(){
  const c = await api('/api/config');
  $('#cAssinatura').value = c.assinatura || '';
  $('#cEscurecer').value = c.escurecer_foto; $('#cEscVal').textContent = Math.round(c.escurecer_foto * 100) + '%';
  $('#cAssFoto').checked = !!c.assinatura_nos_slides_de_foto;
  $('#cores').innerHTML = CORES.map(([k, rot]) => `
    <div class="c"><input type="color" id="k_${k}" value="${c[k]}"><div><span>${rot}</span><code id="h_${k}">${c[k]}</code></div></div>`).join('');
  CORES.forEach(([k]) => $('#k_' + k).oninput = e => $('#h_' + k).textContent = e.target.value);
}
$('#cEscurecer').oninput = e => $('#cEscVal').textContent = Math.round(e.target.value * 100) + '%';
$('#cSalvar').onclick = async () => {
  const body = {assinatura: $('#cAssinatura').value, escurecer_foto: +$('#cEscurecer').value, assinatura_nos_slides_de_foto: $('#cAssFoto').checked};
  CORES.forEach(([k]) => body[k] = $('#k_' + k).value);
  try{ await api('/api/config', {method:'PUT', body: JSON.stringify(body)}); toast('Estilo salvo ✓') }catch(e){ toast(e.message) }
};
